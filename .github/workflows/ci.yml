name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Placeholders in the right shape: the build checks every variable is
    # present and well formed but never calls Clerk, Supabase or Resend, so CI
    # holds no real key. A blank one still fails the build, as in production.
    env:
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
      CLERK_SECRET_KEY: sk_test_ci
      WHATSAPP_NUMBER: "923000000000"
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci
      SITE_URL: http://localhost:3000
      VAPID_PUBLIC_KEY: BAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      VAPID_PRIVATE_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
      RESEND_API_KEY: re_ci
      SELLER_EMAIL: ci@example.com
      # A database built from the migrations alone, on this runner.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fresh per run, so nothing about it can be reused.
      - run: echo "VAULT_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: Types
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Database from the migrations
        run: supabase db start
      - name: Row-level security
        run: pnpm check:rls
